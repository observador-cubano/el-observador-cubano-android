name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    name: Compilar, firmar y publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar etiqueta y secretos
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          VERSION=$(grep '^versionName=' mobile/android/version.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "La etiqueta ${GITHUB_REF_NAME} no coincide con versionName v$VERSION." >&2
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Falta el secreto ANDROID_KEYSTORE_BASE64." >&2
            exit 1
          fi
          echo "Publicando El Observador Cubano $GITHUB_REF_NAME"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar plataforma Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Dependencias web y sincronización de Capacitor
        working-directory: mobile
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Preparar keystore de firma
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/mobile/android/keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 keystore.properties keystore.jks

      - name: Pruebas unitarias
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          ./gradlew :app:testDebugUnitTest --no-daemon \
            -PeocGithubOwner="$OWNER" \
            -PeocGithubRepo="$NAME"

      - name: Compilar APK release firmada
        working-directory: mobile/android
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          ./gradlew :app:assembleRelease --no-daemon \
            -PeocGithubOwner="$OWNER" \
            -PeocGithubRepo="$NAME"

      - name: Verificar firma, paquete y versión
        working-directory: mobile/android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "package:|application-label:"
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "versionName='$VERSION'" \
            || { echo "El APK no tiene versionName $VERSION" >&2; exit 1; }

      - name: Comprobar continuidad de la firma
        working-directory: mobile/android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          NEW_CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          PREV_DIR=$(mktemp -d)
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$PREV_DIR" 2>/dev/null; then
            PREV_APK=$(ls "$PREV_DIR"/*.apk | head -1)
            PREV_CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$PREV_APK" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
            if [ "$NEW_CERT" != "$PREV_CERT" ]; then
              echo "La firma no coincide con la Release anterior. Los usuarios no podrían actualizar." >&2
              exit 1
            fi
            echo "Firma continua verificada: $NEW_CERT"
          else
            echo "No hay una Release anterior; se omite la comprobación de continuidad."
          fi
          rm -rf "$PREV_DIR"

      - name: Calcular SHA-256 y preparar activos
        working-directory: mobile/android
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          OUT="$GITHUB_WORKSPACE/release"
          mkdir -p "$OUT"
          NAME="ElObservadorCubano-v$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT/$NAME"
          cd "$OUT"
          sha256sum "$NAME" > "$NAME.sha256"
          cat "$NAME.sha256"

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          NAME="ElObservadorCubano-v$VERSION.apk"
          gh release create "$GITHUB_REF_NAME" \
            "$GITHUB_WORKSPACE/release/$NAME" \
            "$GITHUB_WORKSPACE/release/$NAME.sha256" \
            --title "El Observador Cubano $GITHUB_REF_NAME" \
            --generate-notes

      - name: Publicar APK como artefacto del flujo
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-${{ github.ref_name }}
          path: |
            release/*.apk
            release/*.sha256
          if-no-files-found: error

      - name: Borrar keystore temporal
        if: always()
        run: |
          rm -f mobile/android/keystore.jks mobile/android/keystore.properties
